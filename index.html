<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gift Cards</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <canvas id="matrix"></canvas>
    
    <div class="container">
        <h1>Digital Gift Cards</h1>
        
        <div class="buttons">
            <button class="gift-btn" data-url="https://www.fortnite.com/item-shop/v-bucks?lang=en-US">
                <img src="https://ik.imagekit.io/mt2in2kq1r/png-clipart-fortnite-battle-royale-xbox-one-battle-pass-playstation-4-vbucks-trademark-playstation-4.png" alt="Vbucks">
                <span>V-Bucks</span>
            </button>
            
            <button class="gift-btn" data-url="https://www.roblox.com/upgrades/robux">
                <img src="https://ik.imagekit.io/mt2in2kq1r/images%20(2).png" alt="Robux">
                <span>Robux</span>
            </button>
            
            <button class="gift-btn" data-url="https://discord.com/nitro">
                <img src="https://ik.imagekit.io/mt2in2kq1r/images%20(1).png" alt="Discord">
                <span>Discord Nitro</span>
            </button>
            
            <button class="gift-btn" data-url="https://www.target.com/p/nintendo-eshop-gift-card-email-delivery/-/A-93562336">
                <img src="https://ik.imagekit.io/mt2in2kq1r/images%20(8).jpeg" alt="eShop">
                <span>Nintendo eShop</span>
            </button>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
